name: Next.js Quality & Security Checks

on:
  push:
    branches: [marianocarrazana]
  pull_request:
    branches: [marianocarrazana]

jobs:
  # 1. Fast Code Quality & Type Check
  quality-checks:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20" # Or your Next.js project's Node version
          cache: "npm" # Caches node_modules for faster runs

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (Next.js linter)
        run: npm run lint

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Next.js Production Build Test
        run: npm run build

  # 2. Security Analysis with Semgrep
  security-scan:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep Rules for Next.js & OWASP
        # Uses auto-detection + explicit rule packs for React/JS Security
        run: semgrep scan --config auto --config "p/react" --config "p/owasp-top-ten" --error
